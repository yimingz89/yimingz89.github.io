<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The personal website of Yiming Zheng."
    />
    <meta name="theme-color" content="#f4efe6" />
    <title>Yiming Zheng</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="monogram" href="/" aria-label="Yiming Zheng, home">YZ</a>
        <a
          class="header-link"
          href="https://github.com/yimingz89"
          rel="me"
        >
          GitHub
          <span aria-hidden="true">↗</span>

      <main>
        <section class="hero" aria-labelledby="page-title">

            I’m building my new home on the web. Check back soon—or find me on

          </p>
          <a class="button" href="https://github.com/yimingz89">
            View my GitHub
            <span aria-hidden="true">→</span>
          </a>
        </section>
      </main>

      <footer class="site-footer">
        <p>Built with plain HTML and CSS.</p>
        <p>Hosted on GitHub Pages.</p>
      </footer>
    </div>
  </body>
